<main>
<section>
<h2>Make an Enquiry</h2>
<p>Fill in the form below to book a workshop, clean-up or tree planting day. We will reply within 2 working days.</p>
<form action="#" method="post">
<label for="name">Full Name:</label>
<input type="text" id="name" name="name" required>

<label for="email">Email Address:</label>
<input type="email" id="email" name="email" required>

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone">

<label for="service">Which service are you interested in?</label>
<select id="service" name="service" required>
<option value="">-- Please choose --</option>
<option value="workshop">School Workshop</option>
<option value="cleanup">Community Clean-Up</option>
<option value="tree">Tree Planting Day</option>
<option value="recycling">Recycling Station</option>
<option value="other">Other</option>
</select>

<label for="date">Preferred Date:</label>
<input type="date" id="date" name="date">

<label for="message">Your Message:</label>
<textarea id="message" name="message" rows="5" placeholder="Tell us about your school, community or event..." required></textarea>

<button type="submit" class="btn">Send Enquiry</button>
</form>
</section>
</main>
